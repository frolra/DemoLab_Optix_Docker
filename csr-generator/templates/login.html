<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in{% if hostname %} &middot; {{ hostname }}{% endif %}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --surface: rgba(255, 255, 255, 0.72);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --border: rgba(0, 0, 0, 0.08);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
    --code-bg: rgba(0, 0, 0, 0.05);
    --danger: #d70015;
    --danger-tint: rgba(215, 0, 21, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.72);
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --accent: #0a84ff;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
      --code-bg: rgba(255, 255, 255, 0.08);
      --danger: #ff453a;
      --danger-tint: rgba(255, 69, 58, 0.16);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; margin: 24px;
    background: var(--surface);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 32px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; text-align: center; }
  p.sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 24px; text-align: center; }
  label { display: block; font-size: 13px; font-weight: 590; color: var(--text-secondary); margin: 0 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; margin-bottom: 16px; font-size: 15px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--code-bg);
    color: var(--text); font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: 11px 18px; font-size: 15px; font-weight: 590; border-radius: 980px;
    border: none; cursor: pointer; background: var(--accent); color: #fff; margin-top: 4px;
  }
  .alert { padding: 12px 16px; border-radius: 12px; font-size: 13.5px; margin-bottom: 20px; background: var(--danger-tint); color: var(--danger); }
  .hint { font-size: 12px; color: var(--text-secondary); margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>CSR Generator</h1>
  <p class="sub">Sign in with your LDAP admin account{% if hostname %} on {{ hostname }}{% endif %}.</p>

  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}

  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>

  <p class="hint">This portal signs certificates directly through this lab's CA. Access is restricted to members of the LDAP admin group.</p>
</div>
</body>
</html>
