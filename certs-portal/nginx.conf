server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        index index.html;
        autoindex off;
    }

    # Only intentionally staged public certificates and manifests are ever
    # placed under downloads/ by install.sh. No private keys and no step-ca
    # secrets are mounted into this container.
    location /downloads/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
