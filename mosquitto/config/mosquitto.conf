persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Enable per-listener authentication so the plain TCP listener (1883) can
# allow anonymous, unencrypted access for quick local testing, while MQTTS
# (8883) and the WebSocket listener (9001) keep requiring
# MQTT_USERNAME/MQTT_PASSWORD as before.
per_listener_settings true

# MQTTS listener for FactoryTalk Optix and other external clients that use
# TLS. Server certificate is issued directly by step-ca (see
# prepare-mqtt.sh). Requires MQTT_USERNAME/MQTT_PASSWORD.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/secrets/mosquitto.passwd

# Plain MQTT listener, no TLS, published directly to the host. Intended
# for quick local testing (e.g. exercising a FactoryTalk Optix scenario
# without TLS) and deliberately allows anonymous access - no certificate,
# username, or password required. This is a documented, intentional
# trade-off for a lab environment: never expose MQTT_BIND_IP on an
# untrusted network when using this listener (see docs/SECURITY.md).
listener 1883
protocol mqtt
allow_anonymous true

# Internal MQTT-over-WebSocket listener. Not published to the host; Caddy
# reverse-proxies WSS traffic to this listener in plaintext ws over the
# internal "web" network, terminating TLS with the ACME certificate.
# Requires MQTT_USERNAME/MQTT_PASSWORD.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/secrets/mosquitto.passwd
