// CloudBeaver initial data configuration, applied once on the very first
// server initialization (see docker-compose.yml's cloudbeaver service and
// docs/DATABASES.md). Pre-seeds the Administrators/Users teams and their
// permissions in CloudBeaver's internal database.
//
// Does NOT set adminName/adminPassword here - two confirmed reasons (found
// by reading CloudBeaver's own source, since no local Docker was available
// to test-run it directly in this environment):
//
// 1. This file is parsed with a plain Gson JSON reader
//    (CBDatabase.readInitialDataConfigurationFile()) with no "${VAR}"
//    substitution at all, unlike cloudbeaver.conf. A literal
//    "${CLOUDBEAVER_ADMIN_USER}" string here becomes the actual admin
//    username (lowercased to "${cloudbeaver_admin_user}" by
//    CBEmbeddedSecurityController.createUser(), which always lowercases
//    new user IDs) - not the real value from .env.
// 2. Users and teams share one subject-ID namespace
//    (CBEmbeddedSecurityController.isSubjectExists()/validateAndCreateUser()
//    check both). A team with subjectId "admin" here would collide with an
//    admin *user* named "admin" - exactly what CLOUDBEAVER_ADMIN_USER
//    defaults to in .env.example - causing
//    "User or team 'admin' already exists" the moment the real
//    auto-configuration mechanism (CB_ADMIN_NAME/CB_ADMIN_PASSWORD, set on
//    the cloudbeaver service in docker-compose.yml) tries to create it.
//    That failure aborts the whole auto-configuration and leaves the
//    "Configure Server" wizard showing on every subsequent visit.
//
// The Administrators team below therefore uses subjectId "administrators"
// (never a valid CLOUDBEAVER_ADMIN_USER value) instead of "admin". The
// Users team keeps subjectId "user" - CloudBeaver's own default
// app.defaultUserTeam ("user", see CLOUDBEAVER_APP_DEFAULT_USER_TEAM) must
// match a team ID declared here, or CloudBeaver refuses to start.
//
// The admin account itself is created solely by CB_ADMIN_NAME/
// CB_ADMIN_PASSWORD (docker-compose.yml), CloudBeaver's real "Automatic
// server configuration" mechanism - it reads real OS environment
// variables and is what actually creates the account AND exits
// configuration mode (skipping the wizard). That admin account still ends
// up with the "admin" permission, granted via membership in the
// "administrators" team below.
{
    teams: [
        {
            subjectId: "administrators",
            teamName: "Administrators",
            description: "Full administrative access to CloudBeaver.",
            permissions: ["admin"]
        },
        {
            subjectId: "user",
            teamName: "Users",
            description: "Standard database access.",
            permissions: []
        }
    ]
}
